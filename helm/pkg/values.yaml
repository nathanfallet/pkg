# Default values for pkg.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 2

image:
  repository: guimauvedigital/pkg
  # Overrides the image tag whose default is the chart appVersion.
  tag: latest

imagePullSecrets: [ ]
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: { }
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: { }
podLabels: { }

podSecurityContext: { }
# fsGroup: 2000

securityContext: { }
# capabilities:
#   drop:
#   - ALL
# readOnlyRootFilesystem: true
# runAsNonRoot: true
# runAsUser: 1000

secretAnnotations: { }

# initContainers -- List of init containers to add to the pod. Values will be evaluated as Helm templates
initContainers: [ ]

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: ""
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "500m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/client-body-timeout: "600"
  hosts:
    - host: pkg.guimauve.digital
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
    - secretName: guimauvedigital-tls
      hosts:
        - pkg.guimauve.digital

resources: { }
# We usually recommend not to specify default resources and to leave this as a conscious
# choice for the user. This also increases chances charts run on environments with little
# resources, such as Minikube. If you do want to specify resources, uncomment the following
# lines, adjust them as necessary, and remove the curly braces after 'resources:'.
# limits:
#   cpu: 100m
#   memory: 128Mi
# requests:
#   cpu: 100m
#   memory: 128Mi

livenessProbe:
  initialDelaySeconds: 30
  periodSeconds: 30
  failureThreshold: 10
  httpGet:
    path: /healthz
    port: http
readinessProbe:
  initialDelaySeconds: 30
  periodSeconds: 30
  failureThreshold: 2
  httpGet:
    path: /readyz
    port: http

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: [ ]
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: [ ]
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: { }

tolerations: [ ]

affinity: { }

# Custom environment variables

# existingSecret -- Name of existing secret,
# Make sure it contains the keys mysql-username, mysql-password
# Also note to set the existingSecret values for the MySQL subchart
existingSecret: ''

#env: dev
env: production

jwt:
  secret: 'secret'

s3:
  id: ''
  key: ''
  region: 'eu-west-3'
  name: 'guimauve-pkg'

# MySQL configuration

mysql:
  image:
    repository: bitnamilegacy/mysql # until we get the new things
  enabled: true
  auth:
    username: ''
    rootPassword: pkg
    database: pkg
    existingSecret: ''
    secretKeys:
      userPasswordKey: mysql-password
  mysqlHost:
